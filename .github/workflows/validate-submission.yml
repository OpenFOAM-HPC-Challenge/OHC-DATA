name: validate-submission

# Every pull request that adds or edits a file under submissions/ is checked
# against the schema in scripts/ohc_schema.py before a human looks at it.  The
# records are *not* appended here: appending happens on push to the default
# branch (see append-submissions.yml), because the token a workflow gets on a
# pull request from a fork -- which is how outside contributions arrive -- is
# read-only and cannot push to the contributor's branch.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'submissions/**.json'
      - 'data/data.json'
      - 'scripts/ohc_schema.py'
      - 'scripts/validate_submission.py'
      - 'scripts/append_submissions.py'
      - '.github/workflows/validate-submission.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the diff against the base branch needs history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect the submissions this pull request touches
        id: changed
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          # --diff-filter=d keeps added/modified files and drops deletions.
          git diff --name-only --diff-filter=d \
            "origin/${BASE_REF}...HEAD" -- 'submissions/*.json' > changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed submission files:"
          cat changed.txt

      - name: Check the schema still accepts the existing dataset
        # A change to the schema must not start rejecting records that are
        # already published.  Seven rows carried over from the OHC1 spreadsheet
        # are genuinely broken -- six with a zero wall-clock time, one GPU run
        # with no GPU model -- hence the allowance.  Lower it whenever those
        # rows get fixed.
        run: python3 scripts/validate_submission.py --self-check --max-rejected 7

      - name: Validate the submitted records
        id: validate
        run: |
          set -euo pipefail
          if [ "${{ steps.changed.outputs.count }}" -eq 0 ]; then
            echo '## Submission validation' > report.md
            echo >> report.md
            echo 'No submission files changed in this pull request.' >> report.md
            cat report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          # NUL-separated, so a file name with a space in it survives.
          tr '\n' '\0' < changed.txt \
            | xargs -0 python3 scripts/validate_submission.py \
                --markdown report.md --json report.json || rc=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Comment the report on the pull request
        # Best effort: a pull request from a fork gets a read-only token, so the
        # comment cannot be posted there and the check result plus the job
        # summary are what the contributor sees.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ohc-submission-validation -->';
            if (!fs.existsSync('report.md')) return;
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

      - name: Keep the report with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            report.md
            report.json
          if-no-files-found: ignore
