name: append-submissions

# Once a submission is merged, its records are appended to the global
# data/data.json and the result is committed back to the default branch.
#
# The append is idempotent: data/submissions.lock.json records the SHA-256 of
# every file that has already been merged, so re-running this workflow (or
# merging an unrelated change to submissions/) appends nothing twice.
on:
  push:
    branches: [main]
    paths:
      - 'submissions/**.json'
  workflow_dispatch:            # manual catch-up run

permissions:
  contents: write
  pull-requests: read           # read the merged PR's labels to opt in stamping

concurrency:
  group: append-submissions     # never two appends racing for the same file
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve the OHC iteration and merge date to stamp
        id: stamp
        # A submission need not carry OHC or Submission Date; the merge fills
        # them.  Submission Date is the merge commit's date in UTC.  OHC is the
        # OHC_CURRENT repository variable, but only when the merged pull request
        # carries the opt-in label (OHC_STAMP_LABEL, default "auto-ohc") -- the
        # label is what says "stamp this one with the current round".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OHC_CURRENT: ${{ vars.OHC_CURRENT }}
          STAMP_LABEL: ${{ vars.OHC_STAMP_LABEL || 'auto-ohc' }}
        run: |
          set -euo pipefail
          date="$(TZ=UTC git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)"
          echo "date=${date}" >> "$GITHUB_OUTPUT"

          ohc=""
          if [ -n "${OHC_CURRENT}" ]; then
            # Pull requests whose merge produced this commit; usually exactly one.
            labels="$(gh api -H 'Accept: application/vnd.github+json' \
                        "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                        --jq '.[].labels[].name' 2>/dev/null || true)"
            if printf '%s\n' "${labels}" | grep -qxF "${STAMP_LABEL}"; then
              ohc="${OHC_CURRENT}"
            fi
          fi
          echo "ohc=${ohc}" >> "$GITHUB_OUTPUT"
          echo "stamping date=${date} ohc=${ohc:-<none>} (label='${STAMP_LABEL}')"

      - name: Append every submission the ledger has not seen
        id: append
        # This fails, appending nothing, when data/data.json has lost records
        # the ledger already accounts for -- a deleted or hand-truncated
        # dataset.  Restore the dataset rather than re-running: a file the
        # ledger lists is never appended again, so an append on top of the
        # loss would make it permanent.  See check_ledger() in the script.
        env:
          STAMP_OHC: ${{ steps.stamp.outputs.ohc }}
          STAMP_DATE: ${{ steps.stamp.outputs.date }}
        run: |
          set -euo pipefail
          args=(--all --summary summary.md --submission-date "${STAMP_DATE}")
          if [ -n "${STAMP_OHC}" ]; then
            args+=(--ohc "${STAMP_OHC}")
          fi
          python3 scripts/append_submissions.py "${args[@]}" | tee append.log
          echo "records=$(sed -n 's/^::appended:://p' append.log | tail -1)" \
            >> "$GITHUB_OUTPUT"
          if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit the updated dataset
        if: steps.append.outputs.records != ''
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "data/ is unchanged, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/submissions.lock.json
          git commit \
            -m "data: append ${{ steps.append.outputs.records }} record(s) from submissions" \
            -m "Appended by append-submissions.yml for ${{ github.sha }}."
          # Another append may have landed while this one ran; rebase onto it
          # rather than force the branch.  The retries live in an `if`, where
          # `set -e` leaves a failing command to the loop instead of aborting.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1
